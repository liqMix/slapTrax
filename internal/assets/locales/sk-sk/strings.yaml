# Dialogs
dialog.howtoplay: "Cieľom hry je dosiahnuť čo najvyššie skóre zasiahnutím všetkých nôt v skladbe.\nKaždá nota sa k tebe pohybuje po dráhe.\nTieto dráhy sú priradené ku klávesom v rovnakej časti tvojej klávesnice.\nStlač akýkoľvek kláves v danej sekcii presne v čase noty, aby si získal čo najlepšie skóre.\nNeskoré alebo predčasné zásahy majú za následok nižšie skóre za danú notu."
dialog.besuretologin: "Nezabudni sa prihlásiť, aby si postupoval v rebríčku!"
dialog.besuretooffset: "Ak máš problémy so zasahovaním nôt, skús si v nastaveniach upraviť posun."

