# Offset
offset.instructions: "<b>Zvukový offset\nUpravuje, kedy sa prehráva hudba\nOvplyvňuje iba vizuálnu stránku\n\n<b>Vstupný offset\nUpravuje, kedy sa zaznamenávajú tvoje stlačenia\nOvplyvňuje iba vstup\n\nAk si všimneš, že noty nie sú zosynchronizované s hudbou, ktorú počuješ,\nuprav podľa toho svoj ZVUKOVÝ OFFSET:\nAk noty prichádzajú na čiaru zásahu PRED rytmom:\nZNÍŽ svoj ZVUKOVÝ OFFSET, aby sa hudba prehrávala skôr\nAk noty prichádzajú na čiaru zásahu PO rytme:\nZVÝŠ svoj ZVUKOVÝ OFFSET, aby sa hudba prehrávala neskôr\n\nAk si všimneš, že dostávaš hodnotenia BAD a MISS\nkeď noty stláčaš presne načas:\nUprav svoj VSTUPNÝ OFFSET"
offset.input: "ZÁSAH: MEDZERNÍK\n\n\nZVUKOVÝ OFFSET:\nZVÝŠIŤ: ŠÍPKA HORE\nZNÍŽIŤ: ŠÍPKA DOLE\n\n\nVSTUPNÝ OFFSET:\nZVÝŠIŤ: ŠÍPKA VPRAVO\nZNÍŽIŤ: ŠÍPKA VĽAVO\n\n\nPoznámka:\nAk si nie si istý, skontroluj hlavné logo pre audio/vizuálnu synchronizáciu."

